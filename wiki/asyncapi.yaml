asyncapi: 3.0.0
info:
  title: APIExpose Real-time Events
  version: 1.5.0
  description: |
    WebSocket event surface of the APIExpose plugin for RetroBat / EmulationStation.
    Local only (127.0.0.1). Connect to `/ws` for the unfiltered firehose or to
    `/ws/{stream}` for a filtered feed. Some streams replay their last snapshot
    as soon as a client connects (retained messages).

    Live discovery endpoint: `GET http://127.0.0.1:12345/api/v1/ws/streams`
    (always in sync with the running build - this document mirrors it).

    Contract policy: additive JSON only - fields are added, never removed nor renamed.
defaultContentType: application/json

servers:
  local:
    host: 127.0.0.1:12345
    protocol: ws
    description: Local machine only. Nothing leaves the PC.

channels:
  firehose:
    address: /ws
    description: >
      Every event except esevent.* (raw EmulationStation hook traffic). On connect,
      the firehose sends one `deck.snapshot` first (see /ws/deck), so a PlayerDeck
      reading the firehose knows the current game state without waiting for changes.
      The firehose also accepts the client messages documented on /ws/deck.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
      deckSnapshot:
        $ref: '#/components/messages/deckSnapshot'
  frontend:
    address: /ws/frontend
    description: >
      Prefixes `ui.` - EmulationStation navigation and lifecycle:
      ui.system.selected, ui.game.selected, ui.game.started, ui.game.ended,
      ui.event, ui.frontend.started, ui.frontend.stopped (frontend process
      lifecycle - replaces polling the emulationstation process).
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  esevent:
    address: /ws/esevent
    description: >
      Prefixes `esevent.` - raw EmulationStation hook refreshes (esevent.events_refresh).
      Aliases: es-event, es_event, esevents, es-events.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  marquee:
    address: /ws/marquee
    description: >
      Prefixes `marquee.` - marquee media snapshots for the selected game/system:
      marquee.snapshot, marquee.snapshot.updated.
      Payload carries `Media` (legacy named fields, kept as-is) plus `Assets` and,
      in game scope, `SystemAssets`: tables keyed by canonical media kind holding
      only what THAT scope really owns. A key is present only when the file is.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  topper:
    address: /ws/topper
    description: >
      Prefixes `topper.` - topper media snapshots (topper.snapshot). Payload carries
      `Media.Topper` plus `Assets`/`SystemAssets`: the game identity and printed matter
      a topper can show (flyer, box art, wheel, fanart, screenshot), and `Text`:
      description, genre, players, rating in the language EmulationStation is set to.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  instruction-card:
    address: /ws/instruction-card
    description: >
      Prefixes `instruction-card.` - instruction card snapshots
      (instruction-card.snapshot). Aliases: instructioncard, instruction_card, instructions.
      Payload carries `Cards`, `Assets`/`SystemAssets` (wheel, box art, flyer, fanart),
      `Text` (description, genre, players, rating in the EmulationStation language) and
      `Controls`: what each button DOES and its colour, from resources/dynpanels -
      enough to compose a card, not only to show one. The full panel geometry stays on
      /ws/panel.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  screen:
    address: /ws/screen
    description: >
      Prefixes `screen.` - secondary screen snapshots (screen.snapshot). Payload carries
      `Media` plus `Assets`/`SystemAssets`: screen-shaped media, with the title screen
      (`image`) and the in-game capture (`thumbnail`) kept apart.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  panel:
    address: /ws/panel
    description: >
      Prefixes `panel.`, `theme.` - resolved control panel of the current
      context: panel.state (retained, replayed on connect),
      cpo.panel.config.selected, panel.settings.changed.


      Also carries, on the SAME channel because it is the same subject:


      `panel.config.changed` (retained) - the CABINET's own description: how many
      player panels, how many buttons each, which peripherals, and the rows they
      sit in. Static configuration: it only moves when the user reconfigures, so
      it is retained rather than repeated on every selection.


      `panel.input.pressed` / `panel.input.released` - a physical press, already
      resolved to a panel slot (player, slot, function) and never a raw button
      index. This is what makes a wiring check possible without any LED
      hardware: press a button, see that slot light up. START and SELECT are
      reported as system inputs rather than as "no slot" - they are wired on
      their own pins, outside the numbered slots. These are EVENTS, not state:
      a consumer that coalesces snapshots must not coalesce them, or a press and
      its release cancel each other out.


      `panel.state` also carries `Svg`: the two drawn views of this panel (top
      and 3D front), each with its file path, its size and WHERE each button
      landed inside the drawing. The geometry travels with the file so a
      consumer can light a button exactly where the artwork drew it, without
      recomputing this renderer's layout on its side.
    messages:
      panelState:
        $ref: '#/components/messages/panelState'
  ingame:
    address: /ws/ingame
    description: >
      Prefixes `ingame.`, `retroarch.`, `wrapper.` - in-game memory events:
      ingame.memory.changed, retroarch.memory.changed, ingame.mame.session.started/stopped.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  arcade:
    address: /ws/arcade
    description: >
      Prefixes `arcade.`, `mame.`, `fbneo.`, `outputs.` - arcade outputs (lamps)
      and sessions: mame.session.started, mame.output.changed.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  score:
    address: /ws/score
    description: >
      Prefix `score.live.` - normalized live score, all sources
      (score.live.changed, retained). Alias: scores.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  timer:
    address: /ws/timer
    description: >
      Prefix `timer.live.` - normalized live timer (timer.live.changed, retained).
      Alias: timers.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  speedrun:
    address: /ws/speedrun
    description: >
      Prefix `speedrun.` - speedrun challenge session, for the SpeedrunHUD:
      speedrun.session (snapshot, retained: sessionId, attemptId, attemptNumber,
      challengeId, rulesVersion, state, cause, sequence, start, official, splits,
      comparisons, allowedActions, demo, counters), speedrun.state, speedrun.started,
      speedrun.finish.provisional, speedrun.attempt.ended, speedrun.attempt.opened,
      speedrun.restart.failed, speedrun.comparison, speedrun.session.closed
      (retained after the game ends). Every event carries the session `sequence`.
      Commands go through POST /api/v1/speedrun/commands (local token).
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  retroachievements:
    address: /ws/retroachievements
    description: >
      Prefixes `retroachievements.` - session, catalog (retained), challenges,
      leaderboards, unlocks, rich presence, runtime.* inference events.
      Aliases: retroachievement, cheevos.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  hiscore:
    address: /ws/hiscore
    description: >
      Prefixes `hiscore.` - high score captures and updates: hiscore.updated,
      hiscore.console.score.captured. Aliases: highscore, highscores, hiscores.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  media:
    address: /ws/media
    description: Prefixes `media.` - media store changes.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  roms:
    address: /ws/roms
    description: >
      Prefixes `roms.`, `rom-pack.`, `romset.` - Roms Manager and pack installer events.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  system:
    address: /ws/system
    description: >
      Prefixes `startup.`, `health.`, `version.`, `hub.`, `config.`,
      `maintenance.`, `rules.`, `notifications.` - service-level events.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  control:
    address: /ws/control
    description: >
      Prefixes `commands.`, `intent.`, `es-control.` - command and navigation
      acknowledgements.
    messages:
      envelope:
        $ref: '#/components/messages/envelope'
  deck:
    address: /ws/deck
    description: >
      The PlayerDeck feed. Prefixes `deck.`, `score.live.`, `retroarch.memory.`,
      `ingame.memory.`, `panel.input.`, `ui.game.started`, `ui.game.ended` - what
      the Deck displays, without the rest of the firehose.


      `deck.snapshot` (sent on connect, here and on /ws, and on request): the whole
      state at revision N - `Game` (as deck.game), `Scores` (last score.live per
      player), `Signals` (last value of every .MEM signal seen this game, one entry
      per channel/name/address/player), `HeldInputs` (panel inputs currently held),
      `Controls` (as deck.controls), `Frame` (as deck.frame), `FramePlans`,
      `Semantics` (as deck.semantics, or null). Events that follow carry a higher
      `Revision`.


      `deck.game`: the launched game, from the game-start hook on, before any .MEM
      signal. `State` = launching | running | ended. `SystemId`, `CanonicalSystem`,
      `Rom`, `RomGroup` (+ `RomGroupSource`: catalog | file), `Name`, `Core`,
      `Video` once RetroArch logged the core geometry (`BaseWidth`/`BaseHeight` =
      unrotated buffer, `Rotation` in quarter turns, `Width`/`Height` = displayed
      image, `Aspect` given by the core, `Fps`, `Orientation`), `Orientation`.


      `deck.controls`: what each panel button really does in the launched game.
      Per player, per RetroPad identity read by the API (`Identity`, the same as
      panel.input.*): `RetroPad` sent to the core after the remap RetroArch really
      loaded, `Remapped`, `Disabled`, `GameButton`, `Function`, `Descriptor` (core
      probe), `Color`. `Remap.Source` = retroarch.log (file read) | none (RetroArch
      loaded no remap) | core-default (unknown, `Assumed` true). `Functions.Source` =
      dynpanel.probe | none (no function is guessed).


      `deck.frame`: where RetroArch draws the game. `Window` = measured client area
      (physical screen pixels), `Viewport` = image rectangle on screen,
      `ViewportInWindow` = same, relative to the client area, computed from the
      settings RetroArch read (retroarch.cfg + appended files); `Mode`, `Aspect`,
      `PixelScale` (screen pixels per game pixel), `Plan` (requested frame and
      `Status` applied | not-applied with `Reason`). Published on change only.


      `deck.semantics`: what the .MEM signals of the launched game mean for display,
      read from the companion `.SMEM` file next to the .MEM in effect (same layer:
      official, .user, .contest; else the official layer). Published once per launch,
      as soon as the first .MEM signal names its definition file. The .SMEM declares
      no address to watch and never enters scoring nor the certified fingerprint.
      `Status` = loaded | absent (no .SMEM: keep address bindings) | invalid
      (`Errors` say why; no signal published). `Signals[]`: `Id` (canonical, e.g.
      players.1.resources.bombs), `Player`, `Kind` (counter | level | enum | flag |
      gauge), `Unit`, `Label`, `Short` (English), `From[]` = the .MEM lines that carry
      its value (`Address` hex, `Action`, `Player`; null = the line has no player and
      matches any signal player), `Values[]` (enumeration: `Raw` or `RawMin`..`RawMax`
      -> `Value`, `Label`), `Scale` (displayed = raw * `Num` / `Den` + `Add`), `Min`,
      `Max` (out of bounds = invalid, never shown), `Initial` (before any event),
      `Quality` (qualified | partial | unproven), `Available` (false = show as
      unavailable). The current value of a signal is the raw value of the LAST event
      of any of its `From` lines. `Instruments[]`: `Id`, `Label`, `Player`, `Show`,
      `Signals` (ids). `SmemSha256`/`MemSha256`: bytes read (information only).
      Format: CDC-NelfePlay-PlayerDeck-Annexe-SMEM.md (schema 1).


      Client messages (JSON text, envelope `Type` [+ `Payload`]):
      `deck.snapshot.request` -> deck.snapshot to this client only;
      `deck.frame.request` (`Frame`: `SystemId`, `Rom` (empty = any game), `X`, `Y`,
      `Width`, `Height` in physical pixels of the RetroArch client area,
      `ScreenWidth`, `ScreenHeight`, `Theme`) -> `deck.ack`; the frame lives as long
      as the connection; `deck.frame.clear` (`SystemId`, `Rom`) -> `deck.ack`.
      REST twin: GET /api/v1/deck/snapshot, GET|PUT|DELETE /api/v1/deck/frame-plan
      (writes need the local token), GET /api/v1/deck/frame-plan/session.
    messages:
      deckSnapshot:
        $ref: '#/components/messages/deckSnapshot'
      deckGame:
        $ref: '#/components/messages/deckGame'
      deckControls:
        $ref: '#/components/messages/deckControls'
      deckFrame:
        $ref: '#/components/messages/deckFrame'
      deckSemantics:
        $ref: '#/components/messages/deckSemantics'
      deckAck:
        $ref: '#/components/messages/deckAck'
      deckClientRequest:
        $ref: '#/components/messages/deckClientRequest'

components:
  messages:
    envelope:
      name: EventEnvelope
      title: Generic event envelope
      payload:
        $ref: '#/components/schemas/Envelope'
    panelState:
      name: PanelState
      title: panel.state (retained snapshot)
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: real-capture
          summary: Real frame captured from a running install (truncated payload)
          payload:
            Type: panel.state
            Ts: '2026-07-18T21:11:40.0533714Z'
            NodeId: cab-01
            CorrelationId: 1c513dc1-3e27-4fc1-98cc-99e0f17beb32
            Payload:
              SnapshotVersion: 2
              Source: resources/dynpanels
              Trigger: ui.game.selected.raw
              SelectionKey: mame|flagrall
              Emulator: mame64
              SystemId: mame
              Rom: flagrall
              Scope: game
    deckSnapshot:
      name: DeckSnapshot
      title: deck.snapshot (on connect to /ws and /ws/deck, and on request)
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: 19xx-in-game
          payload:
            Type: deck.snapshot
            Ts: '2026-11-08T16:06:30.0000000Z'
            Payload:
              Schema: nelfeplay.deck.snapshot/1
              Revision: 412
              Reason: connect
              Game: { LaunchId: 5d1c, State: running, SystemId: fbneo, CanonicalSystem: arcade, Rom: 19xx, RomGroup: 19xx, Name: '19XX: The War Against Destiny', Core: fbneo }
              Scores: [ { Player: 1, Score: 123450, ScoreKind: game, Source: retroarch.wrapper } ]
              Signals: [ { Key: ACTION.LOSE_LIFE, Channel: ACTION, Name: LOSE_LIFE, Address: '0xFF82EC', Value: 2, Player: 1, Frame: 5400 } ]
              HeldInputs: [ { Player: 1, Identity: b, Slot: 1, Device: 0 } ]
              FramePlans: []
    deckGame:
      name: DeckGame
      title: deck.game
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: 19xx-running
          payload:
            Type: deck.game
            Ts: '2026-11-08T16:05:24.0000000Z'
            Payload:
              LaunchId: 5d1c
              State: running
              SystemId: fbneo
              CanonicalSystem: arcade
              Rom: 19xx
              RomGroup: 19xx
              RomGroupSource: catalog
              Name: '19XX: The War Against Destiny'
              Core: fbneo
              Video: { BaseWidth: 384, BaseHeight: 224, Rotation: 1, RotationDegrees: 90, Width: 224, Height: 384, Aspect: 0.75, Fps: 59.63, Orientation: vertical, Source: retroarch.log, Crc32: a3ddb605 }
              Orientation: vertical
              OrientationSource: core
    deckControls:
      name: DeckControls
      title: deck.controls
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: 19xx
          payload:
            Type: deck.controls
            Payload:
              SystemId: fbneo
              Rom: 19xx
              Core: fbneo
              CoreLibrary: FinalBurn Neo
              Remap: { Source: retroarch.log, Scope: game, Path: 'E:/RetroBat/emulators/retroarch/config/remaps/FinalBurn Neo/19xx.rmp', Assumed: false }
              Functions: { Source: dynpanel.probe, File: 19xx.json }
              Players:
                - Player: 1
                  Buttons:
                    - { Identity: b, RetroPad: b, Remapped: false, Disabled: false, GameButton: '1', Function: Shoot, Descriptor: Shot, Color: Red }
                    - { Identity: a, RetroPad: a, Remapped: false, Disabled: false, GameButton: '2', Function: Bomb, Descriptor: Bomb, Color: Blue }
                    - { Identity: x, RetroPad: r3, Remapped: true, Disabled: true }
    deckFrame:
      name: DeckFrame
      title: deck.frame
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: 19xx-cabinet-1920x1200
          payload:
            Type: deck.frame
            Payload:
              SystemId: fbneo
              Rom: 19xx
              Window: { X: 0, Y: 0, Width: 1920, Height: 1200 }
              Viewport: { X: 510, Y: 0, Width: 900, Height: 1200 }
              ViewportInWindow: { X: 510, Y: 0, Width: 900, Height: 1200 }
              Mode: core
              AspectRatioIndex: 22
              Aspect: 0.75
              ScaleInteger: false
              Approximate: false
              PixelScale: { X: 4.0179, Y: 3.125 }
              Source: window+config
    deckSemantics:
      name: DeckSemantics
      title: deck.semantics
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: 19xx-test-layer
          payload:
            Type: deck.semantics
            Payload:
              Schema: nelfeplay.deck.semantics/1
              LaunchId: 5d1c
              SystemId: fbneo
              Rom: 19xx
              MemRom: 19xx-the-war-against-destiny
              DefinitionFile: 'E:/RetroBat/plugins/APIExpose/resources/ram/.user/arcade/19xx-the-war-against-destiny.MEM'
              SmemFile: 'E:/RetroBat/plugins/APIExpose/resources/ram/.user/arcade/19xx-the-war-against-destiny.SMEM'
              Status: loaded
              Version: 1
              Game: { System: arcade, Slug: 19xx-the-war-against-destiny, Title: '19XX: The War Against Destiny' }
              Errors: []
              Warnings: []
              Signals:
                - { Id: players.1.resources.bombs, Player: 1, Kind: counter, Unit: bomb, Label: Bombs, Short: BOMB, From: [ { Address: '0xFF8305', Action: BOMB_FIRED, Player: null }, { Address: '0xFF8305', Action: AMMO_GAIN, Player: 1 } ], Values: [], Scale: { Num: 1, Den: 1, Add: 0 }, Min: 0, Max: null, Initial: 3, Quality: qualified, Available: true }
                - { Id: players.1.power.level, Player: 1, Kind: level, Label: Shot, Short: SHOT, From: [ { Address: '0xFF8337', Action: WEAPON_STATE, Player: 1 }, { Address: '0xFF8337', Action: WEAPON_UPGRADE, Player: 1 } ], Values: [ { Raw: 0, Value: 1, Label: Normal }, { Raw: 255, Value: 2, Label: Boosted } ], Scale: { Num: 1, Den: 1, Add: 0 }, Min: 1, Max: 2, Initial: 1, Quality: qualified, Available: true }
                - { Id: progress.stageId, Player: null, Kind: level, Label: Stage, Short: STG, From: [ { Address: '0xFF4DD4', Action: PROGRESSION_STAGE, Player: null } ], Values: [], Scale: { Num: 1, Den: 1, Add: 1 }, Min: 1, Max: 7, Initial: 1, Quality: qualified, Available: true }
                - { Id: players.1.bomb.power, Player: 1, Kind: level, Label: Bomb power, Short: BPWR, From: [ { Address: '0xFF830F', Action: RESOURCE_LOSE, Player: null } ], Values: [], Scale: { Num: 1, Den: 1, Add: 0 }, Quality: unproven, Available: false }
              Instruments:
                - { Id: p1.bombs, Label: Bombs, Player: 1, Show: counter, Signals: [ players.1.resources.bombs ] }
                - { Id: stage, Label: Stage, Player: null, Show: level, Signals: [ progress.stageId ] }
    deckAck:
      name: DeckAck
      title: deck.ack (reply to a client message, to that client only)
      payload:
        $ref: '#/components/schemas/Envelope'
      examples:
        - name: frame-accepted
          payload:
            Type: deck.ack
            Payload: { Request: deck.frame.request, Accepted: true, Reason: null }
    deckClientRequest:
      name: DeckClientRequest
      title: Client to server - deck.snapshot.request, deck.frame.request, deck.frame.clear
      payload:
        type: object
        properties:
          Type: { type: string, enum: [deck.snapshot.request, deck.frame.request, deck.frame.clear] }
          Payload: { type: object }
      examples:
        - name: frame-request
          payload:
            Type: deck.frame.request
            Payload:
              Frame: { SystemId: fbneo, Rom: mslug3, X: 480, Y: 0, Width: 1440, Height: 1080, ScreenWidth: 1920, ScreenHeight: 1080, Theme: metal-slug-3 }
  schemas:
    Envelope:
      type: object
      description: >
        Every event shares this envelope. `Payload` is event-type specific and
        only ever grows (additive contract).
      required: [Type, Ts, Payload]
      properties:
        Type:
          type: string
          description: Dotted event type (routing key), e.g. ui.game.selected.
          examples: [ui.game.selected, panel.state, mame.output.changed]
        Ts:
          type: string
          format: date-time
          description: Server-side timestamp (UTC).
        NodeId:
          type: string
          description: Emitting node identity.
          examples: [cab-01]
        CorrelationId:
          type: string
          description: Correlates related events of one interaction.
        Payload:
          type: object
          description: Event-type specific body.
